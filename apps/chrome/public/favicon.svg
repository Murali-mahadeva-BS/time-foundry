  <!-- Clock face -->
  <circle cx="32" cy="32" r="22" fill="#303036"/>
  <!-- Hour markers -->
  <line x1="32" y1="13" x2="32" y2="17" stroke="#FFFAFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="51" stroke="#FFFAFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="32" x2="17" y2="32" stroke="#FFFAFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="51" y2="32" stroke="#FFFAFF" stroke-width="2" stroke-linecap="round"/>
